<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baba Graduate Chaipatti Wala</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
<div class="logo" id="lg"></div>
<div class="sr"><input id="q" type="search" placeholder="Search chaipatti, masala chai, kulhad…" aria-label="Search" autocomplete="off"><div id="sg" class="sg" hidden></div></div>
<button class="hb" id="lb" data-go="lang">हिन्दी</button><button class="hb" id="ub" data-go="user">Sign in</button><button class="hb" id="sb" data-go="sel">Seller login</button>
<button class="hb" data-go="cart" aria-label="Cart">🛒 Cart <b id="cc">0</b></button>
</header>
<main>
<div id="shop">
<div class="hero"><h1>Authentic chai, delivered to your door</h1><p>Premium chaipatti, masala chai and everything you need for the perfect cup · Free delivery above ₹<span id="fr"></span> · Cash on Delivery</p></div>
<div class="promo" id="promo"></div>
<div class="chips" id="chips"></div>
<div class="tb"><span id="cnt" class="mu"></span><select id="so" aria-label="Sort"><option value="rel">Sort: Popular</option><option value="pa">Price: low to high</option><option value="pd">Price: high to low</option><option value="r">Rating</option></select></div>
<div class="grid" id="grid"></div>
<div class="rec" id="rec"></div>
</div>
<div id="adm" hidden></div>
<div id="det" hidden></div>
<div id="acct" hidden></div>
<footer class="ft"><p>24×7 Customer Care · Cash on Delivery and online payments · No returns or exchanges on food items</p><p>© Baba Graduate Chaipatti Wala</p></footer>
</main>
<div id="ov"><div id="pn"></div></div>
<div id="ts"></div>
<button class="fab" data-go="help">☎ Help 24×7</button>
<script src="js/data.js"></script>
<script src="js/shop.js"></script>
<script src="js/cart.js"></script>
<script src="js/admin.js"></script>
<script src="js/product.js"></script>
<script src="js/v2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
